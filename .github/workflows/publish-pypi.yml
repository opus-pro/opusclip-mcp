name: Publish to PyPI

# Publishes the opusclip-mcp package to PyPI via Trusted Publishing (GitHub OIDC).
# The trusted publisher is registered on pypi.org for this repo + this workflow
# file + the `pypi` environment -- no API tokens, no secrets.
on:
  push:
    tags: ["v*"] # e.g. v0.2.0
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build sdist and wheel
        run: pipx run build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
